name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - name: Detect pre-release mode
        id: pre
        run: |
          if [ -f ".changeset/pre.json" ]; then
            TAG=$(jq -r '.tag' .changeset/pre.json)
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: ${{ steps.pre.outputs.active == 'true' && format('chore: version packages ({0})', steps.pre.outputs.tag) || 'chore: version packages' }}
          commit: ${{ steps.pre.outputs.active == 'true' && format('chore: version packages ({0})', steps.pre.outputs.tag) || 'chore: version packages' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        if: steps.changesets.outputs.published == 'true'

      - name: Generate changelogs and create tags
        if: steps.changesets.outputs.published == 'true'
        run: |
          PUBLISHED='${{ steps.changesets.outputs.publishedPackages }}'
          for row in $(echo "$PUBLISHED" | jq -c '.[]'); do
            NAME=$(echo "$row" | jq -r '.name')
            VERSION=$(echo "$row" | jq -r '.version')

            case "$NAME" in
              "@rdn/typescript") PKG="@rdn/typescript" ;;
              "prettier-plugin-rdn") PKG="prettier-plugin-rdn" ;;
              *) continue ;;
            esac

            echo "Generating changelog for $PKG@$VERSION"
            bun scripts/release/changelog.ts --package "$PKG" --version "$VERSION"

            TAG="${PKG}@${VERSION}"
            git tag -a "$TAG" -m "Release $TAG"
          done

      - name: Push changelogs and tags
        if: steps.changesets.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: 📝 update changelogs"
          git push --follow-tags

      - name: Create GitHub Releases
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PUBLISHED='${{ steps.changesets.outputs.publishedPackages }}'
          for row in $(echo "$PUBLISHED" | jq -c '.[]'); do
            NAME=$(echo "$row" | jq -r '.name')
            VERSION=$(echo "$row" | jq -r '.version')

            case "$NAME" in
              "@rdn/typescript") PKG="@rdn/typescript" ;;
              "prettier-plugin-rdn") PKG="prettier-plugin-rdn" ;;
              *) continue ;;
            esac

            TAG="${PKG}@${VERSION}"
            NOTES=$(bun scripts/release/changelog.ts --package "$PKG" --version "$VERSION" --stdout 2>/dev/null || echo "Release $TAG")
            PRERELEASE=""
            if echo "$VERSION" | grep -q '-'; then PRERELEASE="--prerelease"; fi

            gh release create "$TAG" --title "$TAG" --notes "$NOTES" $PRERELEASE
          done
