name: Rust Release

on:
  push:
    tags:
      - 'rdn-rust@*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#rdn-rust@}" >> $GITHUB_OUTPUT

      - name: Run tests
        working-directory: packages/rdn-rust
        run: cargo test

      # TODO: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Generate release notes
        run: |
          bun scripts/release/changelog.ts --package rdn-rust --version ${{ steps.version.outputs.version }} --stdout > release-notes.md 2>/dev/null || echo "Release rdn-rust@${{ steps.version.outputs.version }}" > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          if echo "${{ steps.version.outputs.version }}" | grep -q '-'; then PRERELEASE="--prerelease"; fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            $PRERELEASE
