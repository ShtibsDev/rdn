name: Python Release

on:
  push:
    tags:
      - 'rdn-python@*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#rdn-python@}" >> $GITHUB_OUTPUT

      - name: Install and test
        working-directory: packages/rdn-python
        run: |
          pip install -e .
          # TODO: pytest

      # TODO: pip install build twine && python -m build && twine upload dist/*

      - name: Generate release notes
        run: |
          bun scripts/release/changelog.ts --package rdn-python --version ${{ steps.version.outputs.version }} --stdout > release-notes.md 2>/dev/null || echo "Release rdn-python@${{ steps.version.outputs.version }}" > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          if echo "${{ steps.version.outputs.version }}" | grep -q '-'; then PRERELEASE="--prerelease"; fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            $PRERELEASE
